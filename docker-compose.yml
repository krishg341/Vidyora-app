# Vidyora development database stack: PostgreSQL + pgAdmin.
# Start it with: npm run db:up   (npm run api / npm run dev start it automatically)
services:
  postgres:
    image: postgres:16-alpine
    container_name: vidyora-postgres
    environment:
      POSTGRES_USER: vidyora
      POSTGRES_PASSWORD: vidyora
      POSTGRES_DB: vidyora
    ports:
      # Host port 5433 avoids clashing with a local PostgreSQL running on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyora -d vidyora"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vidyora-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Desktop mode: skips the pgAdmin login screen.
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Pre-configures the "Vidyora Postgres" server connection (password: vidyora).
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres-data:
  pgadmin-data:
